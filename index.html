<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Animator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0d12;
            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 25px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            color: #9ca3af;
            margin-top: 8px;
        }

        .card {
            background: #151821;
            border: 1px solid #272b36;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 18px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 18px;
        }

        .upload-box {
            border: 2px dashed #3b4252;
            border-radius: 14px;
            padding: 35px 20px;
            text-align: center;
            cursor: pointer;
        }

        .upload-box:hover {
            border-color: #ffffff;
        }

        .upload-box input {
            display: none;
        }

        .upload-button {
            display: inline-block;
            background: #ffffff;
            color: #000000;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        #imageCount {
            margin-top: 12px;
            color: #9ca3af;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            resize: vertical;
            background: #0b0d12;
            color: #ffffff;
            border: 1px solid #303542;
            border-radius: 12px;
            padding: 15px;
            outline: none;
            font-size: 15px;
        }

        textarea:focus {
            border-color: #ffffff;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        select {
            width: 100%;
            padding: 12px;
            background: #0b0d12;
            color: #ffffff;
            border: 1px solid #303542;
            border-radius: 10px;
        }

        .start-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #ffffff;
            color: #000000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .start-button:hover {
            opacity: 0.9;
        }

        #status {
            color: #d1d5db;
            line-height: 1.8;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .preview-grid img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #303542;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            .header h1 {
                font-size: 25px;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .preview-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Image Animator</h1>
        <p>Turn your images into animated videos</p>
    </div>

    <div class="card">

        <h2>📷 Upload Images</h2>

        <label class="upload-box">

            <input
                type="file"
                id="images"
                accept="image/jpeg,image/png,image/webp"
                multiple
            >

            <span class="upload-button">
                Select Images
            </span>

            <div id="imageCount">
                Maximum 50 images
            </div>

        </label>

        <div id="preview" class="preview-grid"></div>

    </div>

    <div class="card">

        <h2>📝 Paste Animation Prompts</h2>

        <textarea
            id="prompts"
            placeholder="हर लाइन में एक animation prompt लिखें...

Example:
Camera slowly moves forward.
Character slowly turns toward camera.
Fog moves through the background."
        ></textarea>

    </div>

    <div class="card">

        <h2>⚙️ Settings</h2>

        <div class="options">

            <div>
                <label>Ratio</label>
                <select id="ratio">
                    <option value="original">Original</option>
                    <option value="16:9">16:9</option>
                    <option value="9:16">9:16</option>
                    <option value="1:1">1:1</option>
                    <option value="4:5">4:5</option>
                    <option value="4:3">4:3</option>
                    <option value="21:9">21:9</option>
                </select>
            </div>

            <div>
                <label>Duration</label>
                <select id="duration">
                    <option value="5">5 Seconds</option>
                </select>
            </div>

            <div>
                <label>Quality</label>
                <select id="quality">
                    <option value="1080p">1080p</option>
                </select>
            </div>

        </div>

    </div>

    <div class="card">

        <h2>🚀 Animation</h2>

        <button id="start" class="start-button">
            Start Animation
        </button>

        <p id="status">
            Waiting for images and prompts...
        </p>

    </div>

</div>

<script src="app.js"></script>

</body>
                        </html>
